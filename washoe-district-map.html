// Districts up for election in 2026 (the ones this story covers)
const ELECTION_DISTRICTS = [2, 3, 5];

const map = L.map('map', {
  scrollWheelZoom: true,
  zoomControl: true
}).setView([40.58, -119.59], 9);

// Base tile layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

function styleFeature(feature) {
  const cdno = feature.properties.CDNO;
  const isElectionDistrict = ELECTION_DISTRICTS.includes(cdno);
  return {
    color: isElectionDistrict ? '#555' : (feature.properties.color || '#666'),
    weight: isElectionDistrict ? 2 : 1,
    dashArray: isElectionDistrict ? null : '2,4',
    fillColor: feature.properties.color || '#666',
    fillOpacity: 0.35,
    opacity: isElectionDistrict ? 0.9 : 0.6
  };
}

const geoLayer = L.geoJSON(geojsonData, {
  style: styleFeature,
  onEachFeature: function(feature, layer) {
    const props = feature.properties;
    const cdno = props.CDNO;
    const isElectionDistrict = ELECTION_DISTRICTS.includes(cdno);

    let popupContent = `<div class="district-popup">
      <h3>District ${cdno}</h3>`;
    if (!isElectionDistrict) {
      popupContent += `<p class="not-up">Not up for election in 2026</p>`;
    } else {
      popupContent += `<p><strong>On the ballot this fall</strong></p>`;
    }
    popupContent += `</div>`;

    layer.bindPopup(popupContent);

    layer.on('mouseover', function() {
      layer.setStyle({ fillOpacity: 0.55 });
    });
    layer.on('mouseout', function() {
      layer.setStyle({ fillOpacity: 0.35 });
    });
  }
}).addTo(map);

// Fit the map to the district boundaries on load
map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `

    <div class="row"><span class="swatch" style="background:#c0392b"></span> District 1</div>
    <div class="row"><span class="swatch" style="background:#2980b9"></span> District 2</div>

      <strong>Solid outline</strong> = on the ballot in 2026 (districts 2, 3 and 5)<br>
      <em>Dashed outline</em> = not up for election<br>
      Click a district for details.
    </div>
  `;
  return div;
};
legend.addTo(map);
